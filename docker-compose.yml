services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dem-drainage-backend
    restart: "no"
    ports:
      - "${DEM_DRAINAGE_BACKEND_PORT:-8055}:8055"
    environment:
      - DEM_DRAINAGE_HOST=0.0.0.0
      - DEM_DRAINAGE_PORT=8055
      - DEM_DRAINAGE_JOB_DIR=/data/jobs
      - DEM_DRAINAGE_CORS_ORIGINS=${DEM_DRAINAGE_CORS_ORIGINS:-http://localhost:3055,http://127.0.0.1:3055,http://0.0.0.0:3055,http://localhost:3000,*}
    volumes:
      - dem_jobs:/data/jobs
      - ./data:/data/local
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8055/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${DEM_DRAINAGE_API_URL:-http://localhost:8055}
    container_name: dem-drainage-frontend
    restart: "no"
    ports:
      - "${DEM_DRAINAGE_FRONTEND_PORT:-3055}:3055"
    environment:
      - NEXT_PUBLIC_API_URL=${DEM_DRAINAGE_API_URL:-http://localhost:8055}
      - PORT=3055
    depends_on:
      backend:
        condition: service_healthy

  cli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dem-drainage-cli
    profiles:
      - cli
    entrypoint: ["dem-drainage"]
    volumes:
      - ./data:/data

volumes:
  dem_jobs:
